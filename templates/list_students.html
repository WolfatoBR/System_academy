<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alunos Cadastrados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Alunos Cadastrados</h1>

        {% if alunos %}
            <table>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                </tr>
                {% for aluno in alunos %}
                <tr>
                    <td>{{ aluno.nome }}</td>
                    <td>{{ aluno.email }}</td>
                    <td>{{ aluno.telefone }}</td>
                    <td>
                        <a href="{{ url_for('edit_student', id=aluno.id) }}">Editar</a>

                        <form action="{{ url_for('delete_student', id=aluno.id) }}" method="post" style="display: inline;" >
                            <button type="submit" onclick="return confirm('Tem certeza que deseja excluir este aluno?')">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </table>
        {% else %}
            <p>Nenhum aluno cadastrado ainda.</p>
        {% endif %}

        <a href="{{ url_for('new_students') }}">Cadastrar novo aluno</a>
    </div>
</body>
</html>
